name: Daily sync (rankings + FX + CNY view)

on:
  schedule:
    - cron: "17 1 * * *" # 每天 09:17（UTC+8）
  workflow_dispatch:

permissions:
  contents: write
  actions: write # 允许推送后用 workflow_dispatch 触发 Data checks（内置 token 的 push 不会触发新 run）

concurrency:
  group: sync-rankings
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull rankings + FX, derive CNY view (keeps old files on failure)
        run: pnpm sync
      - name: Validate public prices and derived-data consistency
        run: pnpm check && pnpm test
      - run: node scripts/render-readme.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "无变化"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date=$(node -p 'require("./data/rankings.json").snapshotDate')
          git commit -am "data(daily): 排行快照 ${date} · 汇率 $(node -p 'require("./data/fx.json").rate')"
          git push
          gh workflow run checks.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
